# The LLVM native code generator (V0.3.x Workstream A).
#
# Standalone package with a detached [workspace] (like compiler/ and
# examples/rtos): it is NOT a member of the parent workspace, so the parent's
# `cargo test --workspace` never builds it and the released keleusma tarball
# never carries it. That detachment is load-bearing here for a reason the other
# detached packages do not have: this package requires an LLVM development
# install. As a workspace member it would make LLVM a hard build dependency of
# the whole repository, for everyone, including CI.
#
# It depends on the parent keleusma runtime by path. For now it consumes the
# Rust reference compiler's in-memory `Module` (operator decision, 2026-08-08);
# reading serialized artefacts through `keleusma::wire_schema` comes later.
[package]
name = "keleusma-native"
version = "0.3.0-dev"
edition = "2024"
publish = false
description = "LLVM native code generation for verified Keleusma bytecode (V0.3.x)."
license = "0BSD"

# Detached from the parent workspace.
[workspace]

[dependencies]
# **`floats` IS LISTED BECAUSE THIS PACKAGE USES IT, NOT BECAUSE IT NEEDS TURNING ON.**
#
# It was already reaching here, but only as a DEFAULT feature of the parent
# crate. `self-host` implies `compile` and `verify`, so those two were genuinely
# declared; `floats` was neither declared nor implied, and arrived solely because
# `default-features` was never disabled.
#
# That made this line a false statement of intent: a reader concludes the backend
# needs `compile` and `self-host`, when the float differential, the float
# composite tests, the declared-width refusals and the ABI scope tests all rest on
# `floats` as well. The realistic failure is a TIDY-UP -- adding
# `default-features = false` is exactly what someone would do on seeing an
# explicit list, and it reads as a clarification.
#
# **Scoped honestly, and measured rather than reasoned about.** Removing this
# declaration AND the defaults does not merely fail a test: the package does not
# COMPILE, because `ScalarKind::Float` disappears. So the behavioural probe in
# `inherited_feature_declaration.rs` cannot be what catches that case, and the
# DECLARATION RATCHET in the same file is the guard that does the work. What this
# line buys is that the manifest describes what the package uses; what the ratchet
# buys is that the description stays accurate.
#
# **It is NOT the runtime finding it resembles.** A float module verifying,
# loading and then TRAPPING on a runtime built without floats is the `v0.2.3`
# line's `INVALID_BYTECODE_CENSUS.md` Group B, a different and larger thing.
keleusma = { path = "..", features = ["compile", "self-host", "floats"] }
inkwell = { version = "0.9", features = ["llvm22-1"] }

# **THE NARROW-FLOAT CONFIGURATION, MADE SELECTABLE.**
#
# `narrow-float-32` belongs to the `keleusma` crate, so without a forwarding
# feature here the four-byte build is reachable only by editing this manifest by
# hand -- which is exactly why it went unmeasured until 2026-08-31, when it was
# found red. Selecting it is now `cargo test --features narrow-float-32`.
[features]
narrow-float-32 = ["keleusma/narrow-float-32"]

[dev-dependencies]
keleusma-arena = { path = "../keleusma-arena" }
