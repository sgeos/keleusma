name: CI

# Trigger on `main` and any version branch (`v*`, e.g. the active `v0.2.x`
# release line and future `v0.3.x` lines), so the WIP release line is CI-gated,
# not only `main`. Reconciles the branching model: work merges into the active
# release line, which CI now covers.
on:
  push:
    branches: [main, 'v*']
  pull_request:
    branches: [main, 'v*']

# Supersede an in-flight run when a PULL REQUEST is pushed again, and leave
# branch runs entirely alone.
#
# WHY IT IS NEEDED. Two pushes to one pull request leave two full 22-job
# matrices running at once; the superseded one never yields and holds runners.
# `gh pr checks` then sits at "17 pass / 5 pending" for many minutes, which is
# indistinguishable from a slow queue and from the CONFLICTING no-run-at-all
# case. The `v0.3.0` line measured ~20 minutes lost to it once and has asked
# three times; this line hand-cancelled two superseded runs in a single session.
#
# WHY THE GROUP IS NOT SIMPLY `github.ref`. The requested form was
# `group: ${{ github.workflow }}-${{ github.ref }}` with `cancel-in-progress:
# true`. This workflow triggers on PUSH as well as pull_request, so that form
# also groups branch runs -- and on a version branch that means a second merge
# CANCELS the first commit's verification run, leaving an intermediate tip with
# no green run of its own. That per-tip branch result is load-bearing here: it
# is what confirms an integrated state rather than a proposed one, and it is
# consulted when deciding whether a merge is safe to build on.
#
# So the group is the ref only for a pull request, and the unique `run_id`
# otherwise. A run keyed by its own id can never collide, so branch runs neither
# cancel nor queue behind each other -- the alternative, grouping them without
# cancelling, would SERIALISE ~45-minute runs behind one another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --workspace --all-targets

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # nextest runs the workspace's two dozen test binaries in parallel; the
      # `ci` profile (.config/nextest.toml) retries to absorb the known
      # temp-file-race flake. Doc-tests run separately (nextest skips them).
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - run: cargo nextest run --profile ci --workspace
      - run: cargo test --workspace --doc

  test-no-default-features:
    name: Test (no default features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - run: cargo nextest run --profile ci -p keleusma --no-default-features
      - run: cargo test -p keleusma --no-default-features --doc

  test-signatures:
    name: Test (signatures feature)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - run: cargo nextest run --profile ci -p keleusma --features signatures
      - run: cargo test -p keleusma --features signatures --doc

  test-self-host:
    # The `self-host` cargo feature of the main crate, which gates the
    # self-hosted compile backend. NOT covered by the `selfhost-compiler`
    # job below, which builds the detached `compiler/` subproject — a
    # different thing with a confusingly similar name.
    name: Test (self-host feature)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - run: cargo nextest run --profile ci -p keleusma --features self-host
      - run: cargo test -p keleusma --features self-host --doc

  test-wire:
    # `keleusma-wire` in both configurations. The reader is allocation-free
    # and must build with no allocator at all, so the default-features run
    # does not cover it; `--all-features` exercises the derive.
    name: Test (keleusma-wire)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - run: cargo nextest run --profile ci -p keleusma-wire --all-features
      - run: cargo test -p keleusma-wire --all-features --doc
      - run: cargo nextest run --profile ci -p keleusma-wire --no-default-features
      - run: cargo test -p keleusma-wire --no-default-features --doc

  test-broad-features:
    name: Test (broad features)
    runs-on: ubuntu-latest
    # `--all-features` is unsuitable for this workspace: it would
    # cascade the mutually-exclusive `narrow-word-*` /
    # `narrow-address-*` selectors into the narrowest configuration
    # and pull in the heavy `sdl3-example` feature, which builds
    # SDL3 from source. The broad set covered here is the docs.rs
    # feature set: defaults (compile + verify + floats) plus the
    # two non-default surfaces (signatures + shell).
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - run: cargo nextest run --profile ci -p keleusma --features signatures,shell
      - run: cargo test -p keleusma --features signatures,shell --doc

  test-bench:
    name: Test (keleusma-bench)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: Default features
        run: |
          cargo nextest run --profile ci -p keleusma-bench
          cargo test -p keleusma-bench --doc
      - name: No default features
        run: cargo build -p keleusma-bench --no-default-features

  examples-sdl3:
    name: Examples (SDL3 feature)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # The `sdl3` crate builds SDL3 from source via cmake under the
      # `build-from-source-static` feature. The cmake configure step
      # requires X11, Wayland, and audio development headers. The
      # dependency list mirrors the SDL3 README for Linux. The
      # earlier `libsdl2-dev` install was wrong: SDL2 development
      # headers are unrelated to the SDL3 source build.
      - name: Install SDL3 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config \
            libasound2-dev libpulse-dev libjack-dev libsndio-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev \
            libxi-dev libxss-dev libxtst-dev libxkbcommon-dev \
            libdrm-dev libgbm-dev libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev \
            libdbus-1-dev libudev-dev \
            libwayland-dev libpipewire-0.3-dev libdecor-0-dev
      - name: Build SDL3-gated examples
        run: cargo build --workspace --examples --features sdl3-example

  doc:
    name: Doc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings -A rustdoc::redundant-explicit-links
    # `--all-features` is unsuitable here for the same reason as
    # the test-broad-features job: the narrow-* selectors and the
    # `sdl3-example` feature would activate together. Build the
    # docs per-crate against the same feature set that docs.rs
    # uses so the CI signal matches the published docs.
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: keleusma (docs.rs feature set)
        run: cargo doc -p keleusma --no-deps --features signatures,encryption,shell
      # The docs.rs set does NOT include `self-host`, so every doc comment
      # under `src/selfhost/` was invisible to this job. A broken or private
      # intra-doc link there fails no test and no clippy run, which is one
      # feature set over from how V0.2.1 shipped with a red Doc job. The
      # module is large and publicly documented, so it gets its own build.
      - name: keleusma (self-host feature)
        run: cargo doc -p keleusma --no-deps --features self-host
      - name: keleusma-arena (all features)
        run: cargo doc -p keleusma-arena --no-deps --all-features
      - name: keleusma-macros
        run: cargo doc -p keleusma-macros --no-deps
      - name: keleusma-bench
        run: cargo doc -p keleusma-bench --no-deps
      - name: keleusma-cli
        run: cargo doc -p keleusma-cli --no-deps
      # This job lists crates BY NAME, so a new crate is invisible to it until
      # someone remembers. That has now happened twice: broken intra-doc links
      # in src/selfhost/ survived four releases, and keleusma-wire went four
      # days with gate coverage but no CI coverage. Add new crates here.
      - name: keleusma (self-host feature surface)
        run: cargo doc -p keleusma --no-deps --features signatures,encryption,shell,self-host
      # THE LEAN SET, which is the only one that catches a link to a
      # feature-gated item. The two steps above both enable `signatures` and
      # `encryption`, so an intra-doc link to something behind either resolves
      # there and the defect is masked. Three such links were live and only
      # `--features self-host` alone reported them.
      #
      # COST, measured rather than estimated: 5.05 s against 5.16 s for the
      # docs.rs step above, on a warm dependency cache. It is marginally CHEAPER
      # than a step already here, because the lean set needs fewer dependencies.
      # One added invocation in an existing job -- no new job and no additional
      # runner, which matters because this workflow gates the `v0.3.0` line too
      # and its runners are contended.
      - name: keleusma (lean self-host set, catches feature-gated doc links)
        run: cargo doc -p keleusma --no-deps --features self-host
      - name: keleusma-wire (all features)
        run: cargo doc -p keleusma-wire --no-deps --all-features
      - name: keleusma-wire-derive
        run: cargo doc -p keleusma-wire-derive --no-deps

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  msrv-arena:
    name: MSRV keleusma-arena (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.85
      - run: cargo check -p keleusma-arena
      - run: cargo check -p keleusma-arena --no-default-features

  msrv-keleusma:
    name: MSRV keleusma (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.88
      - run: cargo check -p keleusma
      - run: cargo check -p keleusma --no-default-features
      - run: cargo check -p keleusma --features signatures
      - run: cargo check -p keleusma --tests

  no-std:
    name: no_std build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - name: Build keleusma against thumbv7em-none-eabihf
        run: cargo build -p keleusma --target thumbv7em-none-eabihf

  rtos-n6-build:
    name: RTOS demonstrator build (N6 / thumbv8m.main-none-eabihf)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv8m.main-none-eabihf
      - name: three-task-n6
        run: |
          cd examples/rtos
          cargo build --release --bin three-task-n6 \
            --target thumbv8m.main-none-eabihf \
            --no-default-features \
            --features stm32n6570dk-platform
      - name: three-task-n6 with verify (boot-time WCET report)
        run: |
          cd examples/rtos
          cargo build --release --bin three-task-n6 \
            --target thumbv8m.main-none-eabihf \
            --no-default-features \
            --features stm32n6570dk-platform,keleusma-verify
      - name: bench-n6
        run: |
          cd examples/rtos
          cargo build --release --bin bench_n6 \
            --target thumbv8m.main-none-eabihf \
            --no-default-features \
            --features stm32n6570dk-platform

  lsp:
    name: LSP (keleusma-lsp)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # keleusma-lsp is a detached-workspace crate (its own [workspace]), so the
      # --workspace jobs above do not cover it. Build, test, and lint it here so
      # a change to the core compiler's public API cannot silently break the
      # language server.
      - name: Build, test, and lint the detached LSP crate
        run: |
          cd keleusma-lsp
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

  selfhost-compiler:
    name: Self-hosted compiler subproject
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # compiler/ is a detached-workspace crate (its own [workspace]) depending on
      # the core runtime by path, so the --workspace jobs above do not cover it. A
      # change to the ISA or the .kel stages that breaks the byte-identical
      # differential-oracle self-compile must fail here. This is the CI counterpart
      # of scripts/release-gate.sh's subproject step — closing the blind spot that
      # let a stale decoder ship `unknown op tag 62` into v0.2.3 (process audit item 4).
      - name: Build, test, and lint the detached compiler subproject
        run: |
          cd compiler
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings
          cargo test

  vscode-extension:
    name: VS Code extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Guard the language client: the manifest must parse, the client script
      # must be syntactically valid, and the committed lockfile must install
      # cleanly against the manifest.
      - name: Validate the extension manifest, client, and lockfile
        run: |
          cd editors/vscode
          node -e "require('./package.json')"
          node --check extension.js
          npm ci

  wasm:
    name: WASM playground crate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      # keleusma-wasm is a detached-workspace crate. Lint and unit-test it
      # natively, then confirm it still compiles to wasm32 — the actual playground
      # target — so a core-API change cannot silently break the browser build.
      # The full wasm-pack bundle + Pages deploy live in the Book workflow.
      - name: Lint, test, and build to wasm32
        run: |
          cd keleusma-wasm
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
          cargo build --target wasm32-unknown-unknown

  miri:
    name: Miri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - name: Stacked borrows
        run: cargo miri test -p keleusma-arena
      - name: Tree borrows
        env:
          MIRIFLAGS: -Zmiri-tree-borrows
        run: cargo miri test -p keleusma-arena

  docs-links:
    name: Doc links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # The link-checker is itself a Keleusma script run through the
      # CLI; it orchestrates POSIX tools and exits non-zero when any
      # relative Markdown link fails to resolve.
      - name: Check relative Markdown links
        run: cargo run -q -p keleusma-cli -- run scripts/check-md-links.kel
      # The book's Instruction Set chapter is generated from the authoritative
      # spec (docs/spec/INSTRUCTION_SET.md). Regenerate and fail on any diff so
      # the two copies can never drift (Rex-review lesson: generate reference
      # material from source and gate drift in CI).
      - name: Instruction Set chapter is in sync with the spec
        run: |
          python3 scripts/gen-book-instruction-set.py
          git diff --exit-code book/src/INSTRUCTION_SET.md
