name: CI

# Trigger on `main` and any version branch (`v*`, e.g. the active `v0.2.x`
# release line and future `v0.3.x` lines), so the WIP release line is CI-gated,
# not only `main`. Reconciles the branching model: work merges into the active
# release line, which CI now covers. `workflow_dispatch` runs the full matrix on
# demand for any branch.
on:
  push:
    branches: [main, 'v*']
  pull_request:
    branches: [main, 'v*']
  workflow_dispatch:

# THE LOAD THIS WORKFLOW PUTS ON A SHARED ACCOUNT, AND WHAT KEEPS IT BOUNDED.
#
# GitHub-hosted runners share one concurrent-job limit across the whole account. On
# 2026-10-25 the account had 20 jobs running and 72 queued, and this repository held 15
# and 60 of them. A full run was then 29 jobs and about 200 runner-minutes, of which
# about 113 were compilation. The reasoning and the measurements are in
# docs/process/kaizen/2026-10-25-ci-load-proposal.md. Four mechanisms bound the load,
# and none removes a check from the full run.
#
# 1. A LIGHT PULL REQUEST runs only the documentation guards, the link check and the
#    script checks. The `changes` job decides, with scripts/ci_classify.py, which fails
#    closed: any error, any unknown path and every push yields the full run.
#    tests/ci_light_path_coverage.rs checks that every test reading documentation is in
#    the `guards` selection, so a light run cannot skip a guard the full run has.
# 2. A BRANCH RUN WHOSE TREE WAS ALREADY TESTED is skipped. A full, green pull-request
#    run certifies its trial-merge tree. When the merge commit has that same tree, with
#    the same stable toolchain, within a day, scripts/ci-certified.sh reports the
#    certifying run and the heavy jobs do not repeat it. `main` is never certified.
# 3. THE SELF-HOST TESTS ARE COMPILED ONCE and the four shards run that archive, rather
#    than each compiling the same binaries for about 17 minutes.
# 4. THE SMALL CHECKS ARE GROUPED into a few jobs whose steps keep their own names and
#    run with `!cancelled()`, so one failure does not hide the next. A source push
#    starts about 15 jobs rather than 29.
permissions:
  contents: read
  actions: read

# Supersede an in-flight run when a PULL REQUEST is pushed again, and leave
# branch runs entirely alone.
#
# WHY IT IS NEEDED. Two pushes to one pull request leave two full 22-job
# matrices running at once; the superseded one never yields and holds runners.
# `gh pr checks` then sits at "17 pass / 5 pending" for many minutes, which is
# indistinguishable from a slow queue and from the CONFLICTING no-run-at-all
# case. The `v0.3.0` line measured ~20 minutes lost to it once and has asked
# three times; this line hand-cancelled two superseded runs in a single session.
#
# WHY THE GROUP IS NOT SIMPLY `github.ref`. The requested form was
# `group: ${{ github.workflow }}-${{ github.ref }}` with `cancel-in-progress:
# true`. This workflow triggers on PUSH as well as pull_request, so that form
# also groups branch runs -- and on a version branch that means a second merge
# CANCELS the first commit's verification run, leaving an intermediate tip with
# no green run of its own. That per-tip branch result is load-bearing here: it
# is what confirms an integrated state rather than a proposed one, and it is
# consulted when deciding whether a merge is safe to build on.
#
# So the group is the ref only for a pull request, and the unique `run_id`
# otherwise. A run keyed by its own id can never collide, so branch runs neither
# cancel nor queue behind each other -- the alternative, grouping them without
# cancelling, would SERIALISE ~45-minute runs behind one another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # `mode` is `full`, `light` or `certified`. Every other job reads it.
  changes:
    name: Change class
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.certify.outputs.mode || steps.classify.outputs.mode }}
      vscode: ${{ steps.classify.outputs.vscode }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 2
      # A pull request checks out its trial merge, whose first parent is the base, so
      # HEAD^1..HEAD is exactly what the pull request changes. A push compares with the
      # commit before it only when that commit is the first parent, which holds for a
      # merge commit and for a single pushed commit. Otherwise the list stays empty,
      # which the classifier treats as full.
      - name: Classify the changed files
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          files=""
          parent=$(git rev-parse -q --verify 'HEAD^1' || true)
          if [ -n "$parent" ] && { [ "$EVENT" = pull_request ] || [ "$parent" = "$BEFORE" ]; }; then
            files=$(git diff --name-only --no-renames 'HEAD^1' HEAD) || files=""
          fi
          printf '%s\n' "$files" | python3 -B scripts/ci_classify.py --event "$EVENT" | tee -a "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/v') && steps.classify.outputs.mode == 'full'
      - name: Look for a full pull-request run of this exact tree
        id: certify
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/v') && steps.classify.outputs.mode == 'full'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/ci-certified.sh | tee -a "$GITHUB_OUTPUT" | tee certified.txt
          if grep -q '^mode=certified' certified.txt; then
            run=$(sed -n 's/^certified_by=//p' certified.txt)
            echo "This tree was tested in full by run $run, a pull-request run of the same tree with the same stable toolchain. The heavy jobs were not repeated." >> "$GITHUB_STEP_SUMMARY"
          fi

  # THE LIGHT RUN'S TEST STEP. These binaries read documentation, the book, workflows or
  # scripts, so a change to those can fail them. The full run reaches them through the
  # `test` job. tests/ci_light_path_coverage.rs reads the `--test` names below and
  # fails when a documentation-reading test is missing from them.
  guards:
    name: Documentation guards
    needs: changes
    if: needs.changes.outputs.mode == 'light'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: nextest
      # `--test` selects at build time, so only these binaries compile. A `-E` filter would
      # compile all of the package's test binaries first and then skip most of them.
      - run: |
          cargo nextest run --profile ci -p keleusma \
            --test book_example_coverage \
            --test book_translation_currency \
            --test ci_shard_coverage \
            --test ci_light_path_coverage \
            --test claimed_counts \
            --test comment_citations \
            --test corpus_pattern_coverage \
            --test documentation_links \
            --test example_index_claims \
            --test gate_ci_correspondence \
            --test invalid_bytecode_indirect_sites \
            --test llms_txt_currency \
            --test proof_evidence_index \
            --test push_order_claims \
            --test release_process_crate_list \
            --test spec_trap_claims \
            --test toolchain_pin_components

  # THE ADVISORY DATABASE, WHICH HAD NEVER BEEN CONSULTED.
  #
  # `cargo audit` was installed on a developer machine and had never been run
  # against this tree: no job here, no step in `scripts/release-gate.sh`, no
  # mention anywhere. Its first run, 2026-09-27, reported THREE advisories against
  # `rkyv 0.8.16` -- RUSTSEC-2026-0233 (use-after-free during deserialization of
  # crafted archives), 0234 and 0235 (out-of-bounds reads) -- all fixed in
  # >= 0.8.17, while `keleusma 0.2.2` was published carrying it. The lock now
  # holds 0.8.18 and the scan is clean across 102 dependencies.
  #
  # WHETHER THOSE ADVISORIES WERE REACHABLE HERE IS A SEPARATE QUESTION, and the
  # measured answer is that no code path invokes rkyv's archive validation or
  # deserialization: `src/wire_format.rs` contains no `rkyv::` use in a code
  # position at all, and `src/bytecode.rs`'s only ones are trait bounds inside
  # derive attributes. See `docs/decisions/DEPENDENCY_ADVISORY_COVERAGE.md`.
  #
  # THE COST IS DELIBERATE AND WORTH STATING. A new advisory published against an
  # unchanged tree turns an unrelated pull request red. That is the price of not
  # accumulating advisories silently, which is what happened for at least four
  # months here.
  lint:
    name: Format, check, clippy and advisories
    needs: changes
    if: needs.changes.outputs.mode == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-audit
      - name: Format
        run: cargo fmt --check
      - name: Check
        if: ${{ !cancelled() }}
        run: cargo check --workspace --all-targets
      - name: Clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Scan the dependency graph against the advisory database
        if: ${{ !cancelled() }}
        run: cargo audit

  # THE HEAVY SELF-HOST BINARIES RUN IN `test-self-host`, NOT HERE. `keleusma-cli`
  # depends on `keleusma` with `self-host` enabled, so a `--workspace` build turns
  # the feature on and this job used to repeat that job's whole corpus. In run
  # 40079197634 on 2026-10-24, 3,198 of this job's 3,458 tests also ran there,
  # for 3.42 of its 3.54 test-hours. The filter drops the `selfhost_*` binaries
  # of `keleusma`, about 190 of the repeated minutes, and leaves 20 test-minutes.
  # No self-host source or test is gated on the `shell`, `signatures` or
  # `encryption` features this job also enables, so dropping them here loses no
  # feature combination they use. `tests/ci_shard_coverage.rs` checks that the
  # self-host job still runs them unfiltered. The job was split into four hash
  # partitions on 2026-10-21, when it exceeded GitHub's six-hour limit on pull
  # request 484. With the filter and opt-level 1 that split is no longer needed.
  test:
    name: Test
    needs: changes
    if: needs.changes.outputs.mode == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      # nextest runs the workspace's two dozen test binaries in parallel; the
      # `ci` profile (.config/nextest.toml) retries to absorb the known
      # temp-file-race flake. Doc-tests run separately, because nextest skips them.
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: nextest
      - run: cargo nextest run --profile ci --workspace -E 'not (package(keleusma) & binary(~selfhost))'
      - run: cargo test --workspace --doc

  # `keleusma-wire` runs in both configurations. Its reader is allocation-free and must
  # build with no allocator at all, so the default-features run does not cover it, and
  # `--all-features` exercises the derive.
  test-packages:
    name: Test (no default features, keleusma-wire, keleusma-bench)
    needs: changes
    if: needs.changes.outputs.mode == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: nextest
      - name: keleusma, no default features
        run: |
          cargo nextest run --profile ci -p keleusma --no-default-features
          cargo test -p keleusma --no-default-features --doc
      - name: keleusma-wire, all features and no default features
        if: ${{ !cancelled() }}
        run: |
          cargo nextest run --profile ci -p keleusma-wire --all-features
          cargo test -p keleusma-wire --all-features --doc
          cargo nextest run --profile ci -p keleusma-wire --no-default-features
          cargo test -p keleusma-wire --no-default-features --doc
      - name: keleusma-bench, default features
        if: ${{ !cancelled() }}
        run: |
          cargo nextest run --profile ci -p keleusma-bench
          cargo test -p keleusma-bench --doc
      - name: keleusma-bench, no default features
        if: ${{ !cancelled() }}
        run: cargo build -p keleusma-bench --no-default-features

  # `--all-features` is unsuitable for this workspace: it would
  # cascade the mutually-exclusive `narrow-word-*` /
  # `narrow-address-*` selectors into the narrowest configuration
  # and pull in the heavy `sdl3-example` feature, which builds
  # SDL3 from source. The broad set covered here is the docs.rs
  # feature set: defaults (compile + verify + floats) plus the
  # two non-default surfaces (signatures + shell).
  test-features:
    name: Test (signatures, and the broad signatures,shell set)
    needs: changes
    if: needs.changes.outputs.mode == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: nextest
      - name: signatures
        run: |
          cargo nextest run --profile ci -p keleusma --features signatures
          cargo test -p keleusma --features signatures --doc
      - name: signatures,shell
        if: ${{ !cancelled() }}
        run: |
          cargo nextest run --profile ci -p keleusma --features signatures,shell
          cargo test -p keleusma --features signatures,shell --doc

  # The `self-host` cargo feature of the main crate, which gates the
  # self-hosted compile backend. NOT covered by the `selfhost-compiler`
  # job below, which builds the detached `compiler/` subproject — a
  # different thing with a confusingly similar name.
  # This is the only place that runs the heavy `selfhost_*` binaries; the `test`
  # job above filters them out. Sharded because on pull request 484, on
  # 2026-10-21, it was cancelled at GitHub's six-hour job limit. Hash assignment
  # depends only on a test's name, so adding a test does not move the others.
  #
  # COMPILED ONCE. Each shard used to compile the same binaries for about 17.5 minutes
  # before running a quarter of them, measured in run 40221696853. This job builds the
  # archive and the shards run it with no compilation. `tests/ci_shard_coverage.rs`
  # checks that the archive selects `-p keleusma --features self-host` unfiltered and
  # that every shard runs that same archive.
  test-self-host-build:
    name: Build the self-host tests
    needs: changes
    if: needs.changes.outputs.mode == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: nextest
      - run: cargo nextest archive -p keleusma --features self-host --archive-file selfhost-tests.tar.zst
      - name: Record the archive size
        run: ls -l selfhost-tests.tar.zst
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: selfhost-tests
          path: selfhost-tests.tar.zst
          retention-days: 1
          compression-level: 0
          overwrite: true
          if-no-files-found: error

  # Every shard must run. `tests/ci_shard_coverage.rs` checks that the matrix lists each
  # shard exactly once, because the gate correspondence guard does not read
  # `--partition` and would pass with a shard missing.
  test-self-host:
    name: Test (self-host feature, shard ${{ matrix.shard }}/4)
    needs: [changes, test-self-host-build]
    if: needs.changes.outputs.mode == 'full'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: nextest
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: selfhost-tests
      - run: cargo nextest run --profile ci --archive-file selfhost-tests.tar.zst --workspace-remap . --partition hash:${{ matrix.shard }}/4
      - if: matrix.shard == 1
        run: cargo test -p keleusma --features self-host --doc

  examples-sdl3:
    name: Examples (SDL3 feature)
    needs: changes
    if: needs.changes.outputs.mode == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      # The `sdl3` crate builds SDL3 from source via cmake under the
      # `build-from-source-static` feature. The cmake configure step
      # requires X11, Wayland, and audio development headers. The
      # dependency list mirrors the SDL3 README for Linux. The
      # earlier `libsdl2-dev` install was wrong: SDL2 development
      # headers are unrelated to the SDL3 source build.
      - name: Install SDL3 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config \
            libasound2-dev libpulse-dev libjack-dev libsndio-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev \
            libxi-dev libxss-dev libxtst-dev libxkbcommon-dev \
            libdrm-dev libgbm-dev libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev \
            libdbus-1-dev libudev-dev \
            libwayland-dev libpipewire-0.3-dev libdecor-0-dev
      - name: Build SDL3-gated examples
        run: cargo build --workspace --examples --features sdl3-example

  doc:
    name: Doc
    needs: changes
    if: needs.changes.outputs.mode == 'full'
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings -A rustdoc::redundant-explicit-links
    # `--all-features` is unsuitable here for the same reason as
    # the test-features job: the narrow-* selectors and the
    # `sdl3-example` feature would activate together. Build the
    # docs per-crate against the same feature set that docs.rs
    # uses so the CI signal matches the published docs.
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: keleusma (docs.rs feature set)
        run: cargo doc -p keleusma --no-deps --features signatures,encryption,shell
      # The docs.rs set does NOT include `self-host`, so every doc comment
      # under `src/selfhost/` was invisible to this job. A broken or private
      # intra-doc link there fails no test and no clippy run, which is one
      # feature set over from how V0.2.1 shipped with a red Doc job. The
      # module is large and publicly documented, so it gets its own build.
      - name: keleusma (self-host feature)
        run: cargo doc -p keleusma --no-deps --features self-host
      - name: keleusma-arena (all features)
        run: cargo doc -p keleusma-arena --no-deps --all-features
      - name: keleusma-macros
        run: cargo doc -p keleusma-macros --no-deps
      - name: keleusma-bench
        run: cargo doc -p keleusma-bench --no-deps
      - name: keleusma-cli
        run: cargo doc -p keleusma-cli --no-deps
      # This job lists crates BY NAME, so a new crate is invisible to it until
      # someone remembers. That has now happened twice: broken intra-doc links
      # in src/selfhost/ survived four releases, and keleusma-wire went four
      # days with gate coverage but no CI coverage. Add new crates here.
      - name: keleusma (self-host feature surface)
        run: cargo doc -p keleusma --no-deps --features signatures,encryption,shell,self-host
      # THE LEAN SET, which is the only one that catches a link to a
      # feature-gated item. The two steps above both enable `signatures` and
      # `encryption`, so an intra-doc link to something behind either resolves
      # there and the defect is masked. Three such links were live and only
      # `--features self-host` alone reported them.
      #
      # COST, measured rather than estimated: 5.05 s against 5.16 s for the
      # docs.rs step above, on a warm dependency cache. It is marginally CHEAPER
      # than a step already here, because the lean set needs fewer dependencies.
      # One added invocation in an existing job -- no new job and no additional
      # runner, which matters because this workflow gates the `v0.3.0` line too
      # and its runners are contended.
      - name: keleusma (lean self-host set, catches feature-gated doc links)
        run: cargo doc -p keleusma --no-deps --features self-host
      - name: keleusma-wire (all features)
        run: cargo doc -p keleusma-wire --no-deps --all-features
      - name: keleusma-wire-derive
        run: cargo doc -p keleusma-wire-derive --no-deps

  # The minimum supported Rust versions and the bare-metal build, one toolchain each.
  # Each command names its toolchain explicitly, so a later toolchain step cannot
  # change which compiler an earlier check used.
  portability:
    name: MSRV and no_std builds
    needs: changes
    if: needs.changes.outputs.mode == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@ccc8c1f930153b792217f06c65a38f23a882993a # 1.85
        id: msrv-arena
      - name: MSRV keleusma-arena (1.85)
        run: |
          cargo +${{ steps.msrv-arena.outputs.name }} check -p keleusma-arena
          cargo +${{ steps.msrv-arena.outputs.name }} check -p keleusma-arena --no-default-features
      - uses: dtolnay/rust-toolchain@360a4e93673de6630fac2478bc9e35244b01a759 # 1.88
        id: msrv-keleusma
        if: ${{ !cancelled() }}
      - name: MSRV keleusma (1.88)
        if: ${{ !cancelled() }}
        run: |
          cargo +${{ steps.msrv-keleusma.outputs.name }} check -p keleusma
          cargo +${{ steps.msrv-keleusma.outputs.name }} check -p keleusma --no-default-features
          cargo +${{ steps.msrv-keleusma.outputs.name }} check -p keleusma --features signatures
          cargo +${{ steps.msrv-keleusma.outputs.name }} check -p keleusma --tests
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        if: ${{ !cancelled() }}
        with:
          targets: thumbv7em-none-eabihf
      - name: Build keleusma against thumbv7em-none-eabihf
        if: ${{ !cancelled() }}
        run: cargo +stable build -p keleusma --target thumbv7em-none-eabihf

  # THE SHELL TOOLING THAT GATES AND MOVES WORK.
  #
  # `scripts/` holds the release gate, the worktree helper and the merge script.
  # A defect in one of those surfaces at the worst moment -- a publication, or a
  # merge -- and nothing checked them. Measured 2026-09-27: all twelve pass
  # `bash -n`, and shellcheck reported THREE warnings and FIVE style findings,
  # all repaired in the increment that added this job. Two of the warnings were
  # real: a `cd` in `verify.sh` that continued silently on failure, and two
  # declarations in `worktree.sh` that masked a command substitution's exit
  # status.
  #
  # An earlier note here said "zero findings". That was wrong, and it came from a
  # counting grep that searched for `^-- SC` where shellcheck emits `^--^ SC`, so
  # it matched nothing. The severity claim WAS right -- no finding is
  # error-severity -- which is a different statement from none existing.
  #
  # The availability check below is deliberate, and so is running with no
  # severity threshold: a threshold would have hidden exactly the eight findings
  # this job was added to surface. A step that silently no-opped when the tool was
  # absent would read as coverage while providing none, which is the failure this
  # repository keeps meeting.
  #
  # The process tooling under scripts/, the interline mailbox, the Jev shadow
  # pilot, the gate summary and the change classifier, carried unit tests that no
  # job ran, so a regression in it failed nothing. The tests use only the standard
  # library. Skipped tests are counted, because a suite that skips everything passes.
  scripts:
    name: Shell scripts and Python tooling
    needs: changes
    if: needs.changes.outputs.mode != 'certified'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Analyse every script under scripts/
        run: |
          command -v shellcheck >/dev/null || {
            echo "shellcheck is not available on this runner; this step would otherwise pass without checking anything"
            exit 1
          }
          shellcheck --version
          shellcheck scripts/*.sh
      - name: Run the scripts/ unit tests
        if: ${{ !cancelled() }}
        run: |
          python3 --version
          python3 -B -m unittest discover -s scripts -p 'test_*.py' -v 2>&1 | tee python-tests.log
          test "${PIPESTATUS[0]}" -eq 0
          ran=$(sed -n 's/^Ran \([0-9]*\) tests\{0,1\} in .*/\1/p' python-tests.log)
          echo "ran ${ran:-0} tests"
          test "${ran:-0}" -ge 50
          ! grep -q "skipped" python-tests.log

  # THE HOST HALF OF THE RTOS EXAMPLE, WHICH NOTHING BUILT, AND THE N6 CROSS-BUILD.
  #
  # `three-task-std`, the host binary that `CLAUDE.md`, `examples/rtos/README.md`
  # and `examples/rtos/MANUAL.md` all give as the quick start, was built by nothing
  # — not this workflow and not `scripts/release-gate.sh`, which does not mention
  # the crate. Six Keleusma task scripts are reachable only through these
  # binaries, including the one that exercises the supervised-restart policy.
  #
  # Measured 2026-09-27, `cargo test` could not even build here. `bench_n6` was
  # auto-discovered from `src/bin/` with no `required-features`, unlike both of
  # its siblings, so a host build tried to compile an embassy-and-defmt binary
  # and failed with eight unresolved imports. Behind that, the crate's own unit
  # tests had been broken since B28 changed the enum representation, invisible
  # because the test target never built.
  #
  # The crate pins its own toolchain, so every command here runs under that pin.
  rtos-host:
    name: RTOS demonstrator (host test and N6 build)
    needs: changes
    if: needs.changes.outputs.mode == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
          targets: thumbv8m.main-none-eabihf
      # The integration test drives the demonstrator under a wall-clock budget,
      # which the kernel gained for exactly this purpose. It runs for nine
      # seconds so the deliberate fault on the faulty task's fifth iteration
      # (1500ms period) is reached and the supervised restart is observed.
      - name: Lint and test the detached RTOS example on the host target
        run: |
          cd examples/rtos
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test --release
      - name: three-task-n6
        if: ${{ !cancelled() }}
        run: |
          cd examples/rtos
          cargo build --release --bin three-task-n6 \
            --target thumbv8m.main-none-eabihf \
            --no-default-features \
            --features stm32n6570dk-platform
      - name: three-task-n6 with verify (boot-time WCET report)
        if: ${{ !cancelled() }}
        run: |
          cd examples/rtos
          cargo build --release --bin three-task-n6 \
            --target thumbv8m.main-none-eabihf \
            --no-default-features \
            --features stm32n6570dk-platform,keleusma-verify
      - name: bench-n6
        if: ${{ !cancelled() }}
        run: |
          cd examples/rtos
          cargo build --release --bin bench_n6 \
            --target thumbv8m.main-none-eabihf \
            --no-default-features \
            --features stm32n6570dk-platform

  # keleusma-lsp and keleusma-wasm are detached-workspace crates (each its own
  # [workspace]), so the --workspace jobs above do not cover them. Build, test, and
  # lint each here so a change to the core compiler's public API cannot silently
  # break the language server or the browser playground.
  detached:
    name: Detached crates (LSP and WASM playground)
    needs: changes
    if: needs.changes.outputs.mode == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Build, test, and lint the detached LSP crate
        run: |
          cd keleusma-lsp
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
      # Lint and unit-test the playground natively, then confirm it still compiles to
      # wasm32, the actual playground target. The full wasm-pack bundle and the Pages
      # deploy live in the Book workflow.
      - name: Lint, test, and build the WASM playground crate to wasm32
        if: ${{ !cancelled() }}
        run: |
          cd keleusma-wasm
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
          cargo build --target wasm32-unknown-unknown

  selfhost-compiler:
    name: Self-hosted compiler subproject
    needs: changes
    if: needs.changes.outputs.mode == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      # compiler/ is a detached-workspace crate (its own [workspace]) depending on
      # the core runtime by path, so the --workspace jobs above do not cover it. A
      # change to the ISA or the .kel stages that breaks the byte-identical
      # differential-oracle self-compile must fail here. This is the CI counterpart
      # of scripts/release-gate.sh's subproject step — closing the blind spot that
      # let a stale decoder ship `unknown op tag 62` into v0.2.3 (process audit item 4).
      - name: Build, test, and lint the detached compiler subproject
        run: |
          cd compiler
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings
          cargo test

  # The extension reads only its own directory, so it runs when that directory changes,
  # or when the change list cannot be read.
  vscode-extension:
    name: VS Code extension
    needs: changes
    if: needs.changes.outputs.vscode == 'true' && needs.changes.outputs.mode != 'certified'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      # Guard the language client: the manifest must parse, the client script
      # must be syntactically valid, and the committed lockfile must install
      # cleanly against the manifest.
      - name: Validate the extension manifest, client, and lockfile
        run: |
          cd editors/vscode
          node -e "require('./package.json')"
          node --check extension.js
          npm ci

  miri:
    name: Miri
    needs: changes
    if: needs.changes.outputs.mode == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04 # nightly
        with:
          components: miri
      - name: Stacked borrows
        run: cargo miri test -p keleusma-arena
      - name: Tree borrows
        env:
          MIRIFLAGS: -Zmiri-tree-borrows
        run: cargo miri test -p keleusma-arena
      # THE LIBRARY PACKAGE'S UNDEFINED-BEHAVIOUR PIN, WHICH RAN NOWHERE BUT A
      # PRE-PUBLICATION GATE INVOCATION.
      #
      # `scripts/release-gate.sh --miri` runs this test and this job did not, so a
      # regression on the null-text-pointer path survived every merge and was
      # caught only when a human ran the gate before a release. The repository
      # permits a merge on this workflow alone, justified by it being a superset of
      # that gate; on Miri it was not. Measured 2026-09-27.
      #
      # Tree Borrows specifically: rkyv archive validation trips Stacked Borrows,
      # so a VM-touching Miri run needs this aliasing model. That is why the gate
      # invokes it this way and why this step does not also run under the default
      # model.
      - name: Tree borrows (library package, null-text-pointer UB pin)
        env:
          MIRIFLAGS: -Zmiri-tree-borrows
        run: |
          cargo miri test -p keleusma \
            --test marshall c1_null_text_pointer_marshals_to_empty_string_not_ub

  docs-links:
    name: Doc links
    needs: changes
    if: needs.changes.outputs.mode != 'certified'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      # The link-checker is itself a Keleusma script run through the
      # CLI; it orchestrates POSIX tools and exits non-zero when any
      # relative Markdown link fails to resolve.
      - name: Check relative Markdown links
        run: cargo run -q -p keleusma-cli -- run scripts/check-md-links.kel
      # The book's Instruction Set chapter is generated from the authoritative
      # spec (docs/spec/INSTRUCTION_SET.md). Regenerate and fail on any diff so
      # the two copies can never drift (Rex-review lesson: generate reference
      # material from source and gate drift in CI).
      - name: Instruction Set chapter is in sync with the spec
        run: |
          python3 scripts/gen-book-instruction-set.py
          git diff --exit-code book/src/INSTRUCTION_SET.md
      # The book's Keleusma programs are executed against the CLI built above.
      # This ran only in the Book workflow, which triggers on the default branch:
      # measured 2026-09-26 it had last run on 2026-07-24 and had never run on the
      # version branch, while book/src had been edited there repeatedly. A
      # freshness guarantee attached to a branch the work does not pass through is
      # not one. The Book workflow keeps its release-binary run; this is the one
      # that sees a feature branch.
      - name: Book examples still describe the implementation
        run: |
          cargo build -q -p keleusma-cli
          python3 book/ci/verify_examples.py target/debug/keleusma book/src

  # A full, green pull-request run certifies the tree it tested, for the `changes` job of
  # the branch run after the merge. `needs` lists every job of the full run, including
  # the archive build, because a job skipped after its dependency failed reports
  # `skipped`, which this condition would otherwise accept.
  certify:
    name: Certify the tested tree
    needs: [changes, lint, test, test-packages, test-features, test-self-host-build, test-self-host, examples-sdl3, doc, portability, scripts, rtos-host, detached, selfhost-compiler, vscode-extension, miri, docs-links]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.changes.outputs.mode == 'full' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Record the tree and the toolchain
        id: certificate
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          {
            echo "tree=$tree"
            echo "toolchain=$(rustc +stable -V)"
            echo "commit=$(git rev-parse HEAD)"
            echo "run=${{ github.run_id }}"
          } > certificate.txt
          cat certificate.txt
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-tree-${{ steps.certificate.outputs.tree }}
          path: certificate.txt
          retention-days: 1
          overwrite: true
          if-no-files-found: error
