# The latest stable Rust, as examples/rtos uses, by the operator's ruling of 2026-11-18
# that Keleusma uses the latest toolchain. A footprint is comparable only between builds
# made by the same compiler, so scripts/footprint.sh records the version beside every
# figure. A new stable release can move the figures, and footprint/budget.tsv names the
# compiler its ceilings were set under, so a move past a ceiling is reviewed with its cause.
[toolchain]
channel = "stable"
components = ["rust-src", "llvm-tools", "rustfmt", "clippy"]
targets = ["thumbv8m.main-none-eabihf"]
